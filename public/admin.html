<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="title.admin">Správa webů</title>
  <link rel="stylesheet" href="/_app/app.css">
</head>
<body>
  <!--header-->

  <main>
    <div class="wrap page">
      <div class="section" id="panel">
        <div class="doc-head">
          <h1 data-i18n="admin.h1">Správa</h1>
        </div>

        <div class="with-side">
          <aside class="side-panel glass">
            <div class="usage">
              <div class="usage-label"><span data-i18n="admin.storage">Úložiště</span><span class="muted" id="storage-text"></span></div>
              <div class="meter"><div id="storage-bar"></div></div>
            </div>
            <nav class="side-nav" role="tablist" aria-orientation="vertical">
              <button type="button" role="tab" data-tab="sites" aria-selected="true"><span data-i18n="admin.tabSites">Weby</span> <span class="count" id="count-sites">0</span></button>
              <button type="button" role="tab" data-tab="users" aria-selected="false"><span data-i18n="admin.tabUsers">Uživatelé</span> <span class="count" id="count-users">0</span></button>
              <button type="button" role="tab" data-tab="visits" aria-selected="false"><span data-i18n="stats.title">Návštěvnost</span></button>
              <button type="button" role="tab" data-tab="whitelist" aria-selected="false"><span data-i18n="admin.tabWhitelist">IP whitelist</span> <span class="count" id="count-whitelist">0</span></button>
            </nav>
            <div class="side-foot">
              <button class="side-item danger" type="button" id="logout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg><span data-i18n="nav.logout">Odhlásit</span></button>
            </div>
          </aside>

          <div class="admin-main">

        <section class="table-panel glass" data-panel="sites">
          <div class="toolbar">
            <input type="text" class="filter" data-for="sites" aria-label="Hledat" data-i18n-aria="admin.filterLabel" data-i18n-placeholder="admin.filter" placeholder="Hledat…" autocomplete="off">
            <label class="check"><input type="checkbox" id="show-deleted-sites"> <span data-i18n="admin.showDeleted">Zobrazit smazané</span></label>
            <span class="toolbar-stats" id="stats"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="admin.thSite">Web</th>
                  <th data-i18n="admin.thOwner">Vlastník</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="site-rows"></tbody>
            </table>
            <div class="empty" id="sites-empty" hidden data-i18n="admin.emptySites">Žádné weby.</div>
          </div>
        </section>

        <section class="table-panel glass" data-panel="users" hidden>
          <div class="toolbar">
            <input type="text" class="filter" data-for="users" aria-label="Hledat" data-i18n-aria="admin.filterLabel" data-i18n-placeholder="admin.filter" placeholder="Hledat…" autocomplete="off">
            <label class="check"><input type="checkbox" id="show-deleted-users"> <span data-i18n="admin.showDeleted">Zobrazit smazané</span></label>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th data-i18n="admin.thUser">Uživatel</th>
                  <th data-i18n="admin.thCreated">Registrace</th>
                  <th class="hide-sm" data-i18n="admin.thSites">Weby</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="user-rows"></tbody>
            </table>
            <div class="empty" id="users-empty" hidden data-i18n="admin.emptyUsers">Žádní uživatelé.</div>
          </div>
        </section>

        <section class="table-panel glass" data-panel="visits" hidden>
          <div id="visits"></div>
        </section>

        <section class="table-panel glass" data-panel="whitelist" hidden>
          <p class="muted" data-i18n="admin.whitelistText">Z těchto IP adres lze zveřejňovat bez účtu a e-mailu. Weby pak chrání heslo (jako dřív).</p>
          <form class="row stack-sm align-end" id="whitelist-form">
            <label class="labeled grow"><span data-i18n="admin.ipPlaceholder">IP adresa</span><input type="text" name="ip" placeholder="203.0.113.7" required autocomplete="off" spellcheck="false"></label>
            <label class="labeled grow"><span data-i18n="admin.notePlaceholder">Poznámka</span><input type="text" name="note" autocomplete="off"></label>
            <button class="btn btn-primary" type="submit" data-i18n="admin.ipAdd">Přidat</button>
          </form>
          <div class="my-ip">
            <span class="muted small" id="your-ip"></span>
            <button class="btn btn-sm" type="button" id="add-my-ip"></button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th data-i18n="audit.ip">IP adresa</th><th data-i18n="admin.thNote">Poznámka</th><th data-i18n="admin.thAdded">Přidáno</th><th></th></tr></thead>
              <tbody id="whitelist-rows"></tbody>
            </table>
            <div class="empty" id="whitelist-empty" hidden data-i18n="admin.emptyWhitelist">Zatím tu nejsou žádné adresy.</div>
          </div>
        </section>
          </div>
        </div>
      </div>

      <dialog class="dialog glass" id="audit-dialog">
        <div class="dialog-head">
          <div>
            <h2 id="audit-title"></h2>
            <p class="muted small" id="audit-sub"></p>
          </div>
          <button class="btn btn-sm" id="audit-close" data-i18n="close">Zavřít</button>
        </div>
        <div class="table-wrap">
          <table class="audit">
            <thead><tr><th data-i18n="audit.when">Kdy</th><th data-i18n="audit.what">Událost</th><th data-i18n="audit.site">Web</th><th data-i18n="audit.ip">IP adresa</th><th data-i18n="audit.detail">Podrobnosti</th></tr></thead>
            <tbody id="audit-rows"></tbody>
          </table>
        </div>
      </dialog>
    </div>
  </main>

  <!--footer-->


  <script src="/_app/i18n.js"></script>
  <script src="/_app/common.js"></script>
  <script src="/_app/stats.js"></script>
  <script src="/_app/admin.js"></script>
</body>
</html>
