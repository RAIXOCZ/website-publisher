<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Připojit aplikaci | freepages.dev</title>
  <link rel="stylesheet" href="/_app/app.css">
</head>
<body>
  <!--header-->

  <main>
    <div class="wrap page">
      <section class="oauth glass" id="oauth">
        <header class="oauth-head">
          <span class="oauth-icon" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9H6.5a3 3 0 0 0 0 6H9M15 9h2.5a3 3 0 0 1 0 6H15M8 12h8"/></svg></span>
          <div>
            <h1 id="oauth-title" data-i18n="confirm.loading">Načítám…</h1>
            <p class="muted" id="oauth-text"></p>
          </div>
        </header>

        <div class="oauth-body" id="oauth-body" hidden>
          <div class="oauth-perms">
            <p class="side-title" data-i18n="oauth.canTitle">Aplikace bude moci</p>
            <ul>
              <li data-i18n="oauth.can1">zveřejňovat nové weby,</li>
              <li data-i18n="oauth.can2">upravovat, přejmenovávat a mazat vaše weby,</li>
              <li data-i18n="oauth.can3">číst soubory a návštěvnost vašich webů.</li>
            </ul>
            <p class="muted small" data-i18n="oauth.revoke">Přístup kdykoli zrušíte v Účtu v části API klíče.</p>
          </div>

          <div class="oauth-action">
            <div id="oauth-signed" hidden>
              <p id="oauth-signed-as"></p>
              <div class="row">
                <button class="btn btn-primary" type="button" id="oauth-allow" data-i18n="oauth.allow">Povolit přístup</button>
                <button class="btn" type="button" id="oauth-deny" data-i18n="oauth.deny">Zamítnout</button>
              </div>
            </div>

            <form id="oauth-form" hidden>
              <p data-i18n="oauth.emailText">Zadejte svůj e-mail.</p>
              <div class="oauth-names" id="oauth-names" hidden>
                <label class="labeled"><span data-i18n="identity.first">Jméno</span><input type="text" name="firstName" autocomplete="given-name" maxlength="80"></label>
                <label class="labeled"><span data-i18n="identity.last">Příjmení</span><input type="text" name="lastName" autocomplete="family-name" maxlength="80"></label>
              </div>
              <label class="labeled"><span data-i18n="identity.email">E-mail</span><input type="email" name="email" data-i18n-placeholder="identity.emailExample" placeholder="jana@example.cz" autocomplete="email" required></label>
              <div class="alert" hidden></div>
              <div class="row">
                <button class="btn btn-primary" type="submit" data-i18n="oauth.send">Poslat potvrzení</button>
                <button class="btn" type="button" id="oauth-deny-2" data-i18n="oauth.deny">Zamítnout</button>
              </div>
              <p class="consent" id="oauth-consent" hidden data-i18n-html="register.consent"></p>
            </form>

            <div id="oauth-wait" hidden>
              <p class="notice" id="oauth-wait-text"></p>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!--footer-->

  <script src="/_app/i18n.js"></script>
  <script src="/_app/common.js"></script>
  <script src="/_app/oauth.js"></script>
</body>
</html>
