# Plain Docker Compose setup without Dokploy (publishes a port on the host).
#   cp .env.example .env   # set RESEND_API_KEY
#   docker compose -f docker-compose.local.yml up -d --build
# Optional: also run a Cloudflare Tunnel connector next to it:
#   docker compose -f docker-compose.local.yml --profile tunnel up -d --build

services:
  publisher:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      PUBLISH_PER_HOUR: ${PUBLISH_PER_HOUR:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      SITE_MAX_MB: ${SITE_MAX_MB:-50}
      ACCOUNT_MAX_MB: ${ACCOUNT_MAX_MB:-100}
      TOTAL_MAX_GB: ${TOTAL_MAX_GB:-20}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-martin@balcar.me}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      UMAMI_URL: ${UMAMI_URL:-https://analytics.martin-balcar.cz}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-31c09086-3589-4740-957a-13d266f49e3a}
    volumes:
      - publisher-data:/data
    ports:
      - "${HOST_PORT:-3000}:3000"

  # In the Cloudflare Zero Trust dashboard point the tunnel's public hostnames
  # (freepages.dev and *.freepages.dev) at http://publisher:3000
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - publisher

volumes:
  publisher-data:
