# Docker Compose file for Dokploy (Compose service, default Compose Path).
# Set RESEND_API_KEY (and optionally ADMIN_EMAIL, PUBLIC_URL, SITE_DOMAIN,
# MAIL_FROM, IP_WHITELIST) in Dokploy's "Environment" tab. No ports are published on the host: Traefik reaches the
# container over dokploy-network. For running without Dokploy see
# docker-compose.local.yml.
#
# Routing is done with the Traefik labels below instead of Dokploy's "Domains"
# tab, because they also match the wildcard *.freepages.dev. Point your
# Cloudflare Tunnel's public hostnames (freepages.dev and *.freepages.dev) at
# Dokploy's Traefik on plain HTTP, e.g. http://localhost:80 (cloudflared on the
# host) or http://dokploy-traefik:80 (cloudflared on dokploy-network).
# If you change the domains, edit the Host/HostRegexp rule too.

services:
  publisher:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-https://freepages.dev}
      SITE_DOMAIN: ${SITE_DOMAIN:-freepages.dev}
      PUBLISH_PER_HOUR: ${PUBLISH_PER_HOUR:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-martin@freepages.dev}
      IP_WHITELIST: ${IP_WHITELIST:-}
    volumes:
      - publisher-data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.website-publisher.entrypoints=web
      - traefik.http.routers.website-publisher.rule=Host(`freepages.dev`) || HostRegexp(`^[a-z0-9-]+\.freepages\.dev$$`)
      - traefik.http.services.website-publisher.loadbalancer.server.port=3000

volumes:
  publisher-data:

networks:
  dokploy-network:
    external: true
